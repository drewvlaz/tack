name = "tack-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Every 6h: sweep R2 blobs that no item_images row references. Catches the
# `parseUrl` → `addItem` orphan window (user closes tab between the two) plus
# the rare R2-delete failure leftovers from `commitWithBlobCleanup`.
[triggers]
crons = ["0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fashion-mood"
database_id = "placeholder-replace-after-create"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "fashion-mood-images"

# Rate-limits parseUrl per client IP. The procedure is the only expensive,
# unauthenticated entry point (HTML fetch + Claude call + image downloads),
# so cap it independently of the rest of the API.
# `unsafe.bindings` is the format the vitest-pool's pinned wrangler accepts;
# the newer top-level `[[ratelimits]]` is equivalent in production but emits
# an "unexpected field" warning from the pinned older wrangler.
[[unsafe.bindings]]
name = "PARSE_LIMITER"
type = "ratelimit"
namespace_id = "fashion-mood-parse"
simple = { limit = 30, period = 60 }

# Rate-limits /api/auth/login and /api/auth/signup per client IP. PBKDF2-600k
# already makes online brute force expensive (~250ms/attempt), but without a
# per-IP cap an attacker can still pipeline credential-stuffing across a list
# of emails. 10/min is generous for humans (a mistyped password retried a few
# times in a minute is well under) and tight on automation.
[[unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "fashion-mood-auth"
simple = { limit = 10, period = 60 }

[vars]
ENVIRONMENT = "development"
# Comma-separated email allowlist for signup. Add yourself to sign up locally.
# Override in `.dev.vars` (gitignored) if you don't want your email in source.
INVITE_EMAILS = "drewvlaz@gmail.com"
