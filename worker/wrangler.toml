name = "tack-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------------
# Top-level config = `wrangler dev` (local development only).
# Deployed envs live under [env.staging] and [env.production] below.
# ------------------------------------------------------------------

# Every 6h: sweep R2 blobs that no item_images row references. Catches the
# `parseUrl` → `addItem` orphan window (user closes tab between the two) plus
# the rare R2-delete failure leftovers from `commitWithBlobCleanup`.
[triggers]
crons = ["0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tack"
database_id = "placeholder-replace-after-create"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "tack-images"

# Rate-limit bindings are commented out for free-tier deploys. Code paths
# (routers/parser.ts, routes/auth/index.ts) skip the .limit() call when the
# binding is absent, so the worker runs fine without them. To re-enable
# (Workers Paid), uncomment these blocks in this file AND under each env
# below — no code changes needed. The newer top-level `[[ratelimits]]` is
# equivalent in production but emits an "unexpected field" warning from the
# vitest-pool's pinned older wrangler, so we use `[[unsafe.bindings]]`.
#
# [[unsafe.bindings]]
# name = "PARSE_LIMITER"
# type = "ratelimit"
# namespace_id = "tack-parse"
# simple = { limit = 30, period = 60 }
#
# [[unsafe.bindings]]
# name = "AUTH_LIMITER"
# type = "ratelimit"
# namespace_id = "tack-auth"
# simple = { limit = 10, period = 60 }

[vars]
ENVIRONMENT = "development"
# Comma-separated email allowlist for signup. Add yourself to sign up locally.
# Override in `.dev.vars` (gitignored) if you don't want your email in source.
INVITE_EMAILS = "drewvlaz@gmail.com"

# ------------------------------------------------------------------
# Staging environment.
# Deploy:   pnpm deploy:staging       (or `wrangler deploy --env staging`)
# Migrate:  pnpm db:migrate:staging
# Secret:   wrangler secret put ANTHROPIC_API_KEY --env staging
# ------------------------------------------------------------------
[env.staging]
name = "tack-worker-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
# Single Pages project ("tack"), git-flow style: `main` deploys are staging
# (branch-alias URL), the `production` branch is the production deployment.
# Used by the CORS middleware in worker/src/index.ts to admit the frontend
# origin.
FRONTEND_ORIGIN = "https://main.tack-cxk.pages.dev"
# Per-env signup allowlist. Move to a secret if you don't want it in source.
INVITE_EMAILS = "drewvlaz@gmail.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "tack-staging"
database_id = "7b84b302-a490-4838-a74a-c97545be4195"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "IMAGES"
bucket_name = "tack-staging-images"

[env.staging.triggers]
crons = ["0 */6 * * *"]

[env.staging.observability]
enabled = true

# ------------------------------------------------------------------
# Production environment.
# Deploy:   pnpm deploy:production
# Migrate:  pnpm db:migrate:production
# Secret:   wrangler secret put ANTHROPIC_API_KEY --env production
# ------------------------------------------------------------------
[env.production]
name = "tack-worker"

[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_ORIGIN = "https://tack-cxk.pages.dev"
INVITE_EMAILS = "drewvlaz@gmail.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "tack-prod"
database_id = "REPLACE_WITH_PROD_D1_ID"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "tack-prod-images"

[env.production.triggers]
crons = ["0 */6 * * *"]

[env.production.observability]
enabled = true
